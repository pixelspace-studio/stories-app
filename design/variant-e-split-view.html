<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=700, initial-scale=1.0">
    <title>Variant E: Split View</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
        :root {
            --color-pink: #FF005E;
            --color-pink-light: #DEB0C1;
            --gray-90: #1A1A1A;
            --gray-80: #333333;
            --gray-70: #4A4A4A;
            --gray-60: #666666;
            --gray-50: #808080;
            --gray-45: #999999;
            --gray-40: #A6A6A6;
            --gray-35: #B3B3B3;
            --gray-30: #CCCCCC;
            --gray-25: #D0D0D0;
            --gray-20: #F2F2F2;
            --warm-gray-20: #FAF8F8;
            --color-white: #FFFFFF;
            --color-background: #FFFFFF;
            --color-border-light: rgba(0,0,0,0.08);
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px;
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
            --radius-xl: 16px; --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --text-xs: 10px; --text-sm: 12px; --text-base: 14px;
            --text-lg: 16px; --text-xl: 18px; --text-2xl: 24px;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: var(--color-background);
            color: var(--gray-90);
            width: 700px; height: 480px;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* === Header === */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-5);
            border-bottom: 1px solid var(--color-border-light);
            height: 50px;
            flex-shrink: 0;
            gap: var(--space-4);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .record-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--color-pink);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .stop-sq {
            width: 9px; height: 9px;
            background: var(--color-white);
            border-radius: 2px;
        }

        .timer {
            font-size: var(--text-base);
            font-weight: 600;
            font-family: 'SF Mono', monospace;
            color: var(--gray-90);
        }

        .rec-label {
            font-size: var(--text-sm);
            color: var(--gray-45);
        }

        .wave-row {
            display: flex; gap: 2px; align-items: center;
        }
        .wave-row .w {
            width: 3px; height: 6px;
            background: var(--gray-30);
            border-radius: 2px;
            animation: wv 1.5s ease-in-out infinite;
        }
        .wave-row .w:nth-child(2) { animation-delay: 0.2s; }
        .wave-row .w:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wv { 0%,100% { height: 5px; } 50% { height: 14px; } }

        .header-right {
            display: flex; align-items: center; gap: var(--space-2);
        }

        .icon-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: var(--gray-20);
            border: none; border-radius: var(--radius-md);
            color: var(--gray-60); cursor: pointer; font-size: var(--text-lg);
        }

        /* === Split body === */
        .split-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* === LEFT: Agent Column (primary, ~62%) === */
        .agent-col {
            flex: 0 0 430px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--color-border-light);
        }

        .col-header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-5);
            border-bottom: 1px solid var(--color-border-light);
            flex-shrink: 0;
        }

        .col-title {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--gray-70);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--gray-30);
            margin-left: auto;
            transition: background var(--transition-fast);
        }

        .status-dot.broadcasting {
            background: var(--color-pink);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected { background: #34C759; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .status-text {
            font-size: var(--text-xs);
            color: var(--gray-40);
        }

        .agent-feed {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4) var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        .agent-feed::-webkit-scrollbar { width: 3px; }
        .agent-feed::-webkit-scrollbar-thumb { background: var(--gray-20); border-radius: 2px; }

        .agent-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            height: 100%;
            color: var(--gray-30);
        }

        .agent-empty i { font-size: 28px; }

        .agent-empty p {
            font-size: var(--text-sm);
            color: var(--gray-35);
            text-align: center;
            line-height: 1.5;
        }

        /* Agent message */
        .agent-msg {
            display: flex;
            gap: var(--space-3);
            animation: up 0.35s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--color-pink);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }

        .avatar i { font-size: 12px; color: var(--color-white); }

        .msg-body { flex: 1; min-width: 0; }

        .msg-label {
            font-size: var(--text-xs);
            color: var(--gray-35);
            margin-bottom: var(--space-1);
        }

        .msg-ctx {
            font-size: var(--text-xs);
            color: var(--gray-40);
            padding: var(--space-1) var(--space-3);
            border-left: 2px solid var(--gray-20);
            margin-bottom: var(--space-2);
            line-height: 1.4;
        }

        .msg-text {
            font-size: var(--text-sm);
            color: var(--gray-80);
            line-height: 1.65;
        }

        /* User bubble */
        .user-bubble {
            align-self: flex-end;
            background: var(--warm-gray-20);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg) var(--radius-lg) 3px var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            animation: up 0.3s ease;
        }

        .user-bubble-label {
            font-size: var(--text-xs);
            color: var(--color-pink);
            margin-bottom: 2px;
        }

        .user-bubble-text {
            font-size: var(--text-xs);
            color: var(--gray-70);
            line-height: 1.4;
        }

        /* Typing */
        .typing {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            animation: up 0.2s ease;
        }

        .typing .avatar { opacity: 0.5; }

        .dots { display: flex; gap: 3px; align-items: center; }

        .dots span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--gray-25);
            animation: blink 1.4s infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }

        /* Prompt bar */
        .prompt-bar {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4) var(--space-3);
            border-top: 1px solid var(--color-border-light);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .p-chip {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: 3px var(--space-2) 3px var(--space-2);
            background: var(--color-background);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            color: var(--gray-50);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .p-chip:hover { border-color: var(--color-pink); color: var(--color-pink); }
        .p-chip.firing { background: var(--color-pink); color: var(--color-white); border-color: var(--color-pink); }

        .p-input {
            flex: 1;
            min-width: 80px;
            padding: 4px var(--space-3);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            color: var(--gray-90);
            background: var(--color-background);
            outline: none;
        }

        .p-input::placeholder { color: var(--gray-30); }
        .p-input:focus { border-color: var(--color-pink); }

        .p-send {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--gray-90);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background var(--transition-fast);
        }
        .p-send:hover { background: var(--color-pink); }
        .p-send i { font-size: 11px; color: var(--color-white); }

        /* === RIGHT: Transcript Column (secondary, ~38%) === */
        .transcript-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--warm-gray-20);
        }

        .transcript-col .col-header {
            border-bottom: 1px solid var(--color-border-light);
        }

        .transcript-col .col-title {
            color: var(--gray-35);
            font-weight: 400;
        }

        .transcript-feed {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-3) var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .transcript-feed::-webkit-scrollbar { width: 3px; }
        .transcript-feed::-webkit-scrollbar-thumb { background: var(--gray-20); border-radius: 2px; }

        .t-chunk {
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: up 0.3s ease;
        }

        .t-chunk-time {
            font-size: var(--text-xs);
            color: var(--gray-30);
            font-family: 'SF Mono', monospace;
        }

        .t-chunk-text {
            font-size: var(--text-xs);
            color: var(--gray-50);
            line-height: 1.55;
        }

        /* Currently transcribing chunk */
        .t-chunk.live .t-chunk-text {
            color: var(--gray-70);
        }

        .t-chunk.live .t-chunk-time {
            color: var(--color-pink);
        }

        .t-empty {
            font-size: var(--text-xs);
            color: var(--gray-30);
            text-align: center;
            padding-top: var(--space-8);
            font-style: italic;
        }

        .reset-btn {
            position: fixed;
            bottom: var(--space-4); right: var(--space-4);
            padding: var(--space-2) var(--space-4);
            background: var(--gray-90); color: var(--color-white);
            border: none; border-radius: var(--radius-md);
            font-size: var(--text-sm); cursor: pointer;
            z-index: 100; opacity: 0.6;
            transition: opacity var(--transition-fast);
        }
        .reset-btn:hover { opacity: 1; }
    </style>
</head>
<body>
<div class="app">
    <header class="app-header">
        <div class="header-left">
            <button class="record-btn"><div class="stop-sq"></div></button>
            <span class="timer" id="timer">00:00</span>
            <span class="rec-label">recording</span>
            <div class="wave-row"><div class="w"></div><div class="w"></div><div class="w"></div></div>
        </div>
        <div class="header-right">
            <button class="icon-btn"><i class="ph ph-notebook"></i></button>
            <button class="icon-btn"><i class="ph ph-gear"></i></button>
        </div>
    </header>

    <div class="split-body">
        <!-- Agent Column (primary) -->
        <div class="agent-col">
            <div class="col-header">
                <span class="col-title">Agent</span>
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Connecting</span>
            </div>

            <div class="agent-feed" id="agentFeed">
                <div class="agent-empty" id="emptyState">
                    <i class="ph ph-robot"></i>
                    <p>Waiting for agent.<br>Broadcasting your words now.</p>
                </div>
            </div>

            <div class="prompt-bar">
                <button class="p-chip" data-p="summarize"><i class="ph ph-text-align-left"></i> Summarize</button>
                <button class="p-chip" data-p="challenge"><i class="ph ph-shield-warning"></i> Challenge</button>
                <button class="p-chip" data-p="ambiguities"><i class="ph ph-question"></i> Ambiguities</button>
                <input class="p-input" id="pInput" placeholder="Ask anything...">
                <button class="p-send" id="pSend"><i class="ph ph-arrow-up"></i></button>
            </div>
        </div>

        <!-- Transcript Column (secondary) -->
        <div class="transcript-col">
            <div class="col-header">
                <i class="ph ph-waveform" style="font-size:11px; color:var(--gray-30)"></i>
                <span class="col-title">Your words</span>
            </div>
            <div class="transcript-feed" id="transcriptFeed">
                <div class="t-empty">Transcription will appear here as you speak.</div>
            </div>
        </div>
    </div>
</div>

<button class="reset-btn" id="resetBtn">Reset</button>

<script>
const S = { timer: 0, ti: null, mi: null, tmi: null, msgIdx: 0, tIdx: 0 };

const agentMsgs = [
    {
        ctx: '"...scalability implications before committing to the architecture..."',
        text: 'Scalability concern is on point. With event-driven microservices, the bottleneck shifts to message broker throughput. Scope Kafka vs NATS early — decision has long-tail consequences.',
        label: 'Re: segment 1'
    },
    {
        ctx: '"...microservices pattern with event-driven communication..."',
        text: 'Correct direction. The hidden cost: distributed tracing becomes non-negotiable. Debugging a failed saga across 6 services without OpenTelemetry is a production nightmare.',
        label: 'Re: segment 2'
    },
    {
        ctx: '"...pain points that are slowing us down..."',
        text: 'Three patterns surfacing: Event Sourcing, CQRS, Saga. They complement each other but compound operational complexity. Critical question: is this team ready to own this in production?',
        label: 'Summary'
    },
    {
        ctx: null,
        text: '⚠️ Data consistency hasn\'t been mentioned. With eventual consistency as the default, you\'ll need explicit decisions on read-your-writes guarantees for user-facing flows.',
        label: 'Risk flag'
    },
];

const tChunks = [
    { t: '0:12', text: "Good morning everyone. Today we're going to discuss the backend rewrite that's been on the roadmap for Q3.", live: false },
    { t: '1:05', text: "Let's start by reviewing the current architecture and identifying the pain points.", live: false },
    { t: '2:18', text: "So the proposal is to use a microservices pattern with event-driven communication.", live: false },
    { t: '3:30', text: "The main challenge is we need to consider the scalability implications before committing.", live: false },
    { t: '4:45', text: "We also need to think about how this affects the deployment pipeline and the on-call rotation.", live: true },
];

const promptMap = {
    summarize: 'Summarize the conversation so far',
    challenge: 'Challenge this — what are the counterarguments?',
    ambiguities: 'What are the ambiguities or unclear points?',
};

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const agentFeed = document.getElementById('agentFeed');
const transcriptFeed = document.getElementById('transcriptFeed');
const timerEl = document.getElementById('timer');
const pInput = document.getElementById('pInput');
const pSend = document.getElementById('pSend');

function setStatus(phase, text) {
    statusText.textContent = text;
    statusDot.className = 'status-dot';
    if (phase === 'b' || phase === 'a') statusDot.classList.add('broadcasting');
    else if (phase === 'c') statusDot.classList.add('connected');
}

function addAgentMsg(msg) {
    document.getElementById('emptyState')?.remove();
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = `<div class="avatar" style="opacity:0.4"><i class="ph ph-robot"></i></div><div class="dots"><span></span><span></span><span></span></div>`;
    agentFeed.appendChild(typing);
    agentFeed.scrollTop = agentFeed.scrollHeight;

    setTimeout(() => {
        typing.remove();
        const div = document.createElement('div');
        div.className = 'agent-msg';
        div.innerHTML = `
            <div class="avatar"><i class="ph ph-robot"></i></div>
            <div class="msg-body">
                <div class="msg-label">${msg.label}</div>
                ${msg.ctx ? `<div class="msg-ctx">${msg.ctx}</div>` : ''}
                <div class="msg-text">${msg.text}</div>
            </div>
        `;
        agentFeed.appendChild(div);
        agentFeed.scrollTop = agentFeed.scrollHeight;
    }, 1000 + Math.random() * 500);
}

function addUserBubble(text) {
    document.getElementById('emptyState')?.remove();
    const div = document.createElement('div');
    div.className = 'user-bubble';
    div.innerHTML = `<div class="user-bubble-label">You</div><div class="user-bubble-text">${text}</div>`;
    agentFeed.appendChild(div);
    agentFeed.scrollTop = agentFeed.scrollHeight;
}

function addTranscriptChunk(chunk) {
    document.querySelector('.t-empty')?.remove();
    const div = document.createElement('div');
    div.className = 'т-chunk' + (chunk.live ? ' live' : '');
    // Fix class name
    div.className = 't-chunk' + (chunk.live ? ' live' : '');
    div.innerHTML = `<span class="t-chunk-time">${chunk.t}</span><span class="t-chunk-text">${chunk.text}</span>`;
    transcriptFeed.appendChild(div);
    transcriptFeed.scrollTop = transcriptFeed.scrollHeight;
}

document.querySelectorAll('.p-chip').forEach(btn => {
    btn.addEventListener('click', () => {
        const text = promptMap[btn.dataset.p] || btn.dataset.p;
        btn.classList.add('firing');
        setTimeout(() => btn.classList.remove('firing'), 1200);
        addUserBubble(text);
        setTimeout(() => addAgentMsg({
            ctx: null,
            text: 'The discussion centers on event-driven microservices. Key themes: scalability, operational complexity, and data consistency. Biggest gap: no alignment on consistency guarantees yet.',
            label: `Response: ${btn.dataset.p}`
        }), 800);
    });
});

pSend.addEventListener('click', send);
pInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

function send() {
    const t = pInput.value.trim();
    if (!t) return;
    pInput.value = '';
    addUserBubble(t);
    setTimeout(() => addAgentMsg({
        ctx: null,
        text: 'Based on the discussion, the core tradeoff is operational simplicity vs. system resilience. The current proposal optimizes for resilience at the cost of complexity.',
        label: 'Custom'
    }), 800);
}

function startTimer() {
    S.ti = setInterval(() => {
        S.timer++;
        timerEl.textContent = `${String(Math.floor(S.timer/60)).padStart(2,'0')}:${String(S.timer%60).padStart(2,'0')}`;
    }, 1000);
}

function runSim() {
    startTimer();
    setStatus('b', 'Broadcasting');

    // Stream transcript chunks
    S.tmi = setInterval(() => {
        if (S.tIdx < tChunks.length) addTranscriptChunk(tChunks[S.tIdx++]);
        else clearInterval(S.tmi);
    }, 2200);

    setTimeout(() => setStatus('a', 'Awaiting agent'), 3000);

    setTimeout(() => {
        setStatus('c', 'Connected');
        addAgentMsg(agentMsgs[0]);
        S.msgIdx = 1;
    }, 6000);

    setTimeout(() => {
        S.mi = setInterval(() => {
            if (S.msgIdx < agentMsgs.length) addAgentMsg(agentMsgs[S.msgIdx++]);
            else clearInterval(S.mi);
        }, 5000);
    }, 10000);
}

document.getElementById('resetBtn').addEventListener('click', () => {
    [S.ti, S.mi, S.tmi].forEach(clearInterval);
    S.timer = 0; S.msgIdx = 0; S.tIdx = 0;
    timerEl.textContent = '00:00';
    agentFeed.innerHTML = `<div class="agent-empty" id="emptyState"><i class="ph ph-robot"></i><p>Waiting for agent.<br>Broadcasting your words now.</p></div>`;
    transcriptFeed.innerHTML = `<div class="t-empty">Transcription will appear here as you speak.</div>`;
    statusDot.className = 'status-dot';
    statusText.textContent = 'Connecting';
    setTimeout(runSim, 400);
});

runSim();
</script>
</body>
</html>

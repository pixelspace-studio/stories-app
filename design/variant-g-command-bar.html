<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=700, initial-scale=1.0">
    <title>Variant G: Command Bar</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
        :root {
            --color-pink: #FF005E;
            --color-pink-light: #DEB0C1;
            --gray-90: #1A1A1A;
            --gray-80: #333333;
            --gray-70: #4A4A4A;
            --gray-60: #666666;
            --gray-50: #808080;
            --gray-45: #999999;
            --gray-40: #A6A6A6;
            --gray-35: #B3B3B3;
            --gray-30: #CCCCCC;
            --gray-25: #D0D0D0;
            --gray-20: #F2F2F2;
            --warm-gray-20: #FAF8F8;
            --color-white: #FFFFFF;
            --color-background: #FFFFFF;
            --color-border-light: rgba(0,0,0,0.08);
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px;
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
            --radius-xl: 16px; --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 28px rgba(0,0,0,0.18);
            --text-xs: 10px; --text-sm: 12px; --text-base: 14px;
            --text-lg: 16px;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: var(--color-background);
            color: var(--gray-90);
            width: 700px; height: 480px;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* === Header === */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-6);
            border-bottom: 1px solid var(--color-border-light);
            height: 52px;
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: var(--space-3); }

        .record-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--color-pink);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .stop-sq { width: 10px; height: 10px; background: var(--color-white); border-radius: 2px; }

        .timer {
            font-size: var(--text-base);
            font-weight: 600;
            font-family: 'SF Mono', monospace;
        }

        .wave-row { display: flex; gap: 2px; align-items: center; }
        .wave-row .w {
            width: 3px; height: 6px; background: var(--gray-30); border-radius: 2px;
            animation: wv 1.5s ease-in-out infinite;
        }
        .wave-row .w:nth-child(2) { animation-delay: 0.2s; }
        .wave-row .w:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wv { 0%,100% { height: 5px; } 50% { height: 14px; } }

        .header-right { display: flex; align-items: center; gap: var(--space-2); }

        .icon-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: var(--gray-20); border: none; border-radius: var(--radius-md);
            color: var(--gray-60); cursor: pointer; font-size: var(--text-lg);
        }

        /* === Main split === */
        .split-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* === Agent column === */
        .agent-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--color-border-light);
        }

        .agent-topbar {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-2) var(--space-5);
            border-bottom: 1px solid var(--color-border-light);
            flex-shrink: 0;
            height: 36px;
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--gray-25);
            transition: background var(--transition-fast);
        }

        .status-dot.broadcasting {
            background: var(--color-pink);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected { background: #34C759; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }

        .status-str {
            font-size: 10px;
            color: var(--gray-40);
            flex: 1;
        }

        /* The "Ask" trigger button in topbar */
        .ask-trigger {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: 3px var(--space-3);
            background: var(--gray-20);
            border: none;
            border-radius: var(--radius-full);
            font-size: 10px;
            color: var(--gray-50);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .ask-trigger:hover {
            background: var(--color-pink);
            color: var(--color-white);
        }

        .ask-trigger i { font-size: var(--text-sm); }

        /* Agent feed */
        .agent-feed {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4) var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        .agent-feed::-webkit-scrollbar { width: 3px; }
        .agent-feed::-webkit-scrollbar-thumb { background: var(--gray-20); border-radius: 2px; }

        .agent-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            height: 100%;
        }

        .agent-empty i { font-size: 24px; color: var(--gray-25); }

        .agent-empty p {
            font-size: 10px;
            color: var(--gray-30);
            text-align: center;
            line-height: 1.5;
        }

        .agent-msg {
            display: flex;
            gap: var(--space-3);
            animation: up 0.35s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--color-pink);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }

        .avatar i { font-size: 11px; color: var(--color-white); }

        .msg-body { flex: 1; min-width: 0; }

        .msg-label {
            font-size: 10px;
            color: var(--gray-35);
            margin-bottom: var(--space-1);
        }

        .msg-ctx {
            font-size: 10px;
            color: var(--gray-40);
            padding: 3px var(--space-3);
            border-left: 2px solid var(--gray-20);
            margin-bottom: var(--space-2);
            line-height: 1.4;
        }

        .msg-text {
            font-size: 10px;
            color: var(--gray-70);
            line-height: 1.7;
        }

        .user-bubble {
            align-self: flex-end;
            background: var(--warm-gray-20);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg) var(--radius-lg) 3px var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            animation: up 0.3s ease;
        }

        .user-bubble-label { font-size: 10px; color: var(--color-pink); margin-bottom: 2px; }
        .user-bubble-text { font-size: 10px; color: var(--gray-60); line-height: 1.4; }

        /* Typing */
        .typing { display: flex; align-items: center; gap: var(--space-2); animation: up 0.2s ease; }
        .dots { display: flex; gap: 3px; align-items: center; }
        .dots span {
            width: 5px; height: 5px; border-radius: 50%; background: var(--gray-25);
            animation: blink 1.4s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }

        /* === Command overlay (appears on Ask click) === */
        .command-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            padding: var(--space-5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .command-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .command-box {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--color-background);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-overlay.open .command-box {
            transform: translateY(0);
        }

        /* Chips section */
        .cmd-chips {
            display: flex;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--color-border-light);
            flex-wrap: wrap;
        }

        .cmd-chip {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: var(--warm-gray-20);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md);
            font-size: 10px;
            color: var(--gray-60);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .cmd-chip:hover {
            border-color: var(--color-pink);
            color: var(--color-pink);
            background: var(--color-background);
        }

        .cmd-chip i { font-size: var(--text-sm); }

        /* Input row */
        .cmd-input-row {
            display: flex;
            align-items: center;
            padding: var(--space-1) var(--space-2) var(--space-1) var(--space-4);
            gap: var(--space-2);
        }

        .cmd-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: var(--text-sm);
            color: var(--gray-90);
            background: transparent;
            padding: var(--space-3) 0;
            font-family: inherit;
        }

        .cmd-input::placeholder { color: var(--gray-30); }

        .cmd-send {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--gray-90);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background var(--transition-fast);
        }

        .cmd-send:hover { background: var(--color-pink); }
        .cmd-send i { font-size: 12px; color: var(--color-white); }

        /* Escape hint */
        .cmd-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-1) var(--space-4) var(--space-2);
            border-top: 1px solid var(--color-border-light);
        }

        .cmd-hint span {
            font-size: 10px;
            color: var(--gray-30);
        }

        .cmd-hint kbd {
            font-size: 10px;
            color: var(--gray-35);
            background: var(--gray-20);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: 'SF Mono', monospace;
            margin-right: var(--space-1);
        }

        /* === Your Story column === */
        .story-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--warm-gray-20);
            transition: flex var(--transition-smooth);
        }

        .story-col.expanded { flex: 0 0 230px; }
        .story-col.collapsed { flex: 0 0 32px; }

        .story-header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3) var(--space-2) var(--space-4);
            border-bottom: 1px solid var(--color-border-light);
            flex-shrink: 0;
            height: 36px;
            cursor: pointer;
            user-select: none;
        }

        .story-header:hover { background: rgba(0,0,0,0.02); }

        .story-col.collapsed .story-header {
            height: 100%;
            flex-direction: column-reverse;
            justify-content: flex-end;
            padding: var(--space-3) 0;
            border-bottom: none;
            border-right: 1px solid var(--color-border-light);
            width: 32px;
            align-items: center;
        }

        .story-title {
            font-size: 10px;
            font-weight: 500;
            color: var(--gray-35);
            flex: 1;
            white-space: nowrap;
        }

        .story-col.collapsed .story-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 9px;
            flex: none;
        }

        .story-chevron {
            font-size: var(--text-base);
            color: var(--gray-25);
            transition: transform var(--transition-smooth);
        }

        .story-col.collapsed .story-chevron { transform: rotate(-90deg); }

        .story-feed {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-3) var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            transition: opacity var(--transition-smooth);
        }

        .story-col.collapsed .story-feed { opacity: 0; pointer-events: none; }
        .story-feed::-webkit-scrollbar { width: 3px; }
        .story-feed::-webkit-scrollbar-thumb { background: var(--gray-20); border-radius: 2px; }

        .t-chunk { display: flex; flex-direction: column; gap: 2px; animation: up 0.3s ease; }

        .t-chunk-time {
            font-size: 9px;
            color: var(--gray-30);
            font-family: 'SF Mono', monospace;
        }

        .t-chunk-text {
            font-size: 9px;
            color: var(--gray-45);
            line-height: 1.55;
        }

        .t-chunk.live .t-chunk-text { color: var(--gray-70); }
        .t-chunk.live .t-chunk-time { color: var(--color-pink); }

        .t-empty { font-size: 9px; color: var(--gray-30); text-align: center; padding-top: var(--space-8); font-style: italic; }

        /* Reset */
        .reset-btn {
            position: fixed;
            bottom: var(--space-4); right: var(--space-4);
            padding: var(--space-2) var(--space-4);
            background: var(--gray-90); color: var(--color-white);
            border: none; border-radius: var(--radius-md);
            font-size: var(--text-sm); cursor: pointer;
            z-index: 200; opacity: 0.5;
            transition: opacity var(--transition-fast);
        }
        .reset-btn:hover { opacity: 1; }
    </style>
</head>
<body>
<div class="app" id="app">
    <header class="app-header">
        <div class="header-left">
            <button class="record-btn"><div class="stop-sq"></div></button>
            <span class="timer" id="timer">00:00</span>
            <span style="font-size:11px; color:var(--gray-45)">recording</span>
            <div class="wave-row"><div class="w"></div><div class="w"></div><div class="w"></div></div>
        </div>
        <div class="header-right">
            <button class="icon-btn"><i class="ph ph-notebook"></i></button>
            <button class="icon-btn"><i class="ph ph-gear"></i></button>
        </div>
    </header>

    <div class="split-body">
        <!-- Agent column -->
        <div class="agent-col">
            <div class="agent-topbar">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-str" id="statusStr">Connecting...</span>
                <button class="ask-trigger" id="askTrigger">
                    <i class="ph ph-chat-dots"></i>
                    Ask
                    <i class="ph ph-caret-up" style="font-size:9px; opacity:0.5"></i>
                </button>
            </div>

            <div class="agent-feed" id="agentFeed">
                <div class="agent-empty" id="emptyState">
                    <i class="ph ph-robot"></i>
                    <p>Waiting for agent.<br>Broadcasting your words now.</p>
                </div>
            </div>
        </div>

        <!-- Your Story column -->
        <div class="story-col expanded" id="storyCol">
            <div class="story-header" id="storyToggle">
                <span class="story-title">Your Story</span>
                <i class="ph ph-caret-right story-chevron"></i>
            </div>
            <div class="story-feed" id="storyFeed">
                <div class="t-empty" id="tEmpty">Transcription will appear as you speak.</div>
            </div>
        </div>
    </div>

    <!-- Command overlay -->
    <div class="command-overlay" id="cmdOverlay">
        <div class="command-box">
            <div class="cmd-chips">
                <button class="cmd-chip" data-p="summarize"><i class="ph ph-text-align-left"></i> Summarize</button>
                <button class="cmd-chip" data-p="challenge"><i class="ph ph-shield-warning"></i> Challenge</button>
                <button class="cmd-chip" data-p="ambiguities"><i class="ph ph-question"></i> Ambiguities</button>
                <button class="cmd-chip" data-p="diagram"><i class="ph ph-graph"></i> Diagram</button>
            </div>
            <div class="cmd-input-row">
                <input type="text" class="cmd-input" id="cmdInput" placeholder="Ask the agent anything...">
                <button class="cmd-send" id="cmdSend"><i class="ph ph-arrow-up"></i></button>
            </div>
            <div class="cmd-hint">
                <kbd>Esc</kbd><span>to close</span>
            </div>
        </div>
    </div>
</div>

<button class="reset-btn" id="resetBtn">Reset</button>

<script>
const S = { timer: 0, ti: null, mi: null, tmi: null, msgIdx: 0, tIdx: 0, storyOpen: true, cmdOpen: false };

const agentMsgs = [
    {
        ctx: '"...scalability implications before committing..."',
        text: 'Scalability concern is valid. With event-driven microservices, bottleneck shifts to message broker throughput at fan-out points. Scope Kafka vs NATS early — long-tail architectural consequences.',
        label: 'Re: segment 1'
    },
    {
        ctx: '"...microservices with event-driven communication..."',
        text: 'Hidden cost: distributed tracing becomes non-negotiable. Debugging a failed saga across 6 services without OpenTelemetry is a production nightmare. Budget this from day one.',
        label: 'Re: segment 2'
    },
    {
        ctx: null,
        text: 'Three patterns surfacing: Event Sourcing, CQRS, Saga. They complement each other but compound operational complexity. Critical: is this team ready to own this in production?',
        label: 'Pattern summary'
    },
    {
        ctx: null,
        text: '⚠️ Data consistency not mentioned. With eventual consistency as default, you need explicit decisions on read-your-writes guarantees for user-facing flows.',
        label: 'Risk'
    },
];

const tChunks = [
    { t: '0:12', text: "Good morning. Today we discuss the backend rewrite on the Q3 roadmap.", live: false },
    { t: '1:05', text: "Let's review the current architecture and identify pain points.", live: false },
    { t: '2:18', text: "Proposal: microservices with event-driven communication.", live: false },
    { t: '3:30', text: "Challenge: scalability implications before committing.", live: false },
    { t: '4:45', text: "Also: deployment pipeline impact and on-call rotation.", live: true },
];

const promptMap = {
    summarize: 'Summarize the conversation so far',
    challenge: 'Challenge this — counterarguments?',
    ambiguities: 'What are the ambiguities or unclear points?',
    diagram: 'Draw a diagram of the main concepts',
};

const statusDot = document.getElementById('statusDot');
const statusStr = document.getElementById('statusStr');
const agentFeed = document.getElementById('agentFeed');
const storyFeed = document.getElementById('storyFeed');
const timerEl = document.getElementById('timer');
const askTrigger = document.getElementById('askTrigger');
const cmdOverlay = document.getElementById('cmdOverlay');
const cmdInput = document.getElementById('cmdInput');
const cmdSend = document.getElementById('cmdSend');
const storyCol = document.getElementById('storyCol');
const storyToggle = document.getElementById('storyToggle');

// Command overlay
function openCmd() {
    S.cmdOpen = true;
    cmdOverlay.classList.add('open');
    setTimeout(() => cmdInput.focus(), 200);
}

function closeCmd() {
    S.cmdOpen = false;
    cmdOverlay.classList.remove('open');
    cmdInput.value = '';
}

askTrigger.addEventListener('click', openCmd);

cmdOverlay.addEventListener('click', e => {
    if (e.target === cmdOverlay) closeCmd();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.cmdOpen) closeCmd();
});

// Collapsible story
storyToggle.addEventListener('click', () => {
    S.storyOpen = !S.storyOpen;
    storyCol.classList.toggle('expanded', S.storyOpen);
    storyCol.classList.toggle('collapsed', !S.storyOpen);
});

function setStatus(phase, text) {
    statusStr.textContent = text;
    statusDot.className = 'status-dot';
    if (phase === 'b' || phase === 'a') statusDot.classList.add('broadcasting');
    else if (phase === 'c') statusDot.classList.add('connected');
}

function addAgentMsg(msg) {
    document.getElementById('emptyState')?.remove();
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = `<div class="avatar" style="opacity:0.35"><i class="ph ph-robot"></i></div><div class="dots"><span></span><span></span><span></span></div>`;
    agentFeed.appendChild(typing);
    agentFeed.scrollTop = agentFeed.scrollHeight;

    setTimeout(() => {
        typing.remove();
        const div = document.createElement('div');
        div.className = 'agent-msg';
        div.innerHTML = `
            <div class="avatar"><i class="ph ph-robot"></i></div>
            <div class="msg-body">
                <div class="msg-label">${msg.label}</div>
                ${msg.ctx ? `<div class="msg-ctx">${msg.ctx}</div>` : ''}
                <div class="msg-text">${msg.text}</div>
            </div>
        `;
        agentFeed.appendChild(div);
        agentFeed.scrollTop = agentFeed.scrollHeight;
    }, 900 + Math.random() * 500);
}

function addUserBubble(text) {
    document.getElementById('emptyState')?.remove();
    const div = document.createElement('div');
    div.className = 'user-bubble';
    div.innerHTML = `<div class="user-bubble-label">You</div><div class="user-bubble-text">${text}</div>`;
    agentFeed.appendChild(div);
    agentFeed.scrollTop = agentFeed.scrollHeight;
}

function addStoryChunk(chunk) {
    document.getElementById('tEmpty')?.remove();
    const div = document.createElement('div');
    div.className = 't-chunk' + (chunk.live ? ' live' : '');
    div.innerHTML = `<span class="t-chunk-time">${chunk.t}</span><span class="t-chunk-text">${chunk.text}</span>`;
    storyFeed.appendChild(div);
    storyFeed.scrollTop = storyFeed.scrollHeight;
}

document.querySelectorAll('.cmd-chip').forEach(btn => {
    btn.addEventListener('click', () => {
        const text = promptMap[btn.dataset.p];
        closeCmd();
        addUserBubble(text);
        setTimeout(() => addAgentMsg({
            ctx: null,
            text: 'The discussion centers on event-driven microservices. Themes: scalability, operational complexity, data consistency. Gap: no alignment on consistency guarantees.',
            label: `Response: ${btn.dataset.p}`
        }), 800);
    });
});

function sendCmd() {
    const t = cmdInput.value.trim();
    if (!t) return;
    closeCmd();
    addUserBubble(t);
    setTimeout(() => addAgentMsg({
        ctx: null,
        text: 'Core tradeoff: operational simplicity vs. system resilience. The proposal optimizes for resilience at significant complexity cost. Worth pressure-testing against team readiness.',
        label: 'Custom'
    }), 800);
}

cmdSend.addEventListener('click', sendCmd);
cmdInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });

function startTimer() {
    S.ti = setInterval(() => {
        S.timer++;
        timerEl.textContent = `${String(Math.floor(S.timer/60)).padStart(2,'0')}:${String(S.timer%60).padStart(2,'0')}`;
    }, 1000);
}

function runSim() {
    startTimer();
    setStatus('b', 'Broadcasting');

    S.tmi = setInterval(() => {
        if (S.tIdx < tChunks.length) addStoryChunk(tChunks[S.tIdx++]);
        else clearInterval(S.tmi);
    }, 2200);

    setTimeout(() => setStatus('a', 'Awaiting agent'), 3000);

    setTimeout(() => {
        setStatus('c', 'Connected');
        addAgentMsg(agentMsgs[0]);
        S.msgIdx = 1;
    }, 6000);

    setTimeout(() => {
        S.mi = setInterval(() => {
            if (S.msgIdx < agentMsgs.length) addAgentMsg(agentMsgs[S.msgIdx++]);
            else clearInterval(S.mi);
        }, 5000);
    }, 10000);
}

document.getElementById('resetBtn').addEventListener('click', () => {
    [S.ti, S.mi, S.tmi].forEach(clearInterval);
    S.timer = 0; S.msgIdx = 0; S.tIdx = 0; S.storyOpen = true;
    timerEl.textContent = '00:00';
    agentFeed.innerHTML = `<div class="agent-empty" id="emptyState"><i class="ph ph-robot"></i><p>Waiting for agent.<br>Broadcasting your words now.</p></div>`;
    storyFeed.innerHTML = `<div class="t-empty" id="tEmpty">Transcription will appear as you speak.</div>`;
    statusDot.className = 'status-dot';
    statusStr.textContent = 'Connecting...';
    storyCol.classList.add('expanded'); storyCol.classList.remove('collapsed');
    closeCmd();
    setTimeout(runSim, 400);
});

runSim();
</script>
</body>
</html>
